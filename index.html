<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورشة ثلاثية الأبعاد</title>
<style>
:root{--bar:#ffffffee;--fg:#1d2733;--line:#c9d3dd;--on:#2a7fff;--onfg:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar:#232b34ee;--fg:#e8edf2;--line:#3a4654;--on:#4d9bff;--onfg:#0b1220}}
:root[data-theme="dark"]{--bar:#232b34ee;--fg:#e8edf2;--line:#3a4654;--on:#4d9bff;--onfg:#0b1220}
html,body{height:100%;margin:0;overflow:hidden;background:#e8eef3;font-family:system-ui,Tahoma,"Segoe UI",sans-serif;color:var(--fg);-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;text-align:center;font-size:14px;pointer-events:none}
.top span{display:inline-block;background:var(--bar);padding:6px 12px;border-radius:14px;border:1px solid var(--line)}
#info{margin-top:6px;font-size:13px;min-height:20px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:space-around;padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bar);border-top:1px solid var(--line)}
button{flex:none;min-width:62px;padding:10px 8px;font:inherit;font-size:13px;white-space:nowrap;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px}
.bar button{flex:1;max-width:72px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px}
.pop{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;justify-content:center;gap:6px;padding:0 8px;flex-wrap:wrap}
.pop.open{display:flex}
#lbl{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
#sp{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:60vh;overflow-y:auto}
#sp label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
#sp input,#sp select{font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#sp input{width:110px}#sp select{width:190px}
#sp option{color:#1d2733;background:#fff}
#sp .r{display:flex;gap:8px}
#sp .r button{flex:1;font-size:14px;padding:8px}
#sa{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;justify-content:center;gap:8px}
#sa button{flex:none;min-width:72px;background:var(--bar);padding:8px 10px;font-size:13px}
#cp{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:62vh;overflow-y:auto}
#cp label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;gap:8px}
#cp input,#cp select{font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#cp input{width:90px}#cp select{width:150px}
#cp option{color:#1d2733;background:#fff}
#cp textarea{width:100%;height:120px;box-sizing:border-box;font:13px/1.5 monospace;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px;-webkit-user-select:text;user-select:text}
#cp .r{display:flex;gap:6px;margin:6px 0}
#cp .r button{flex:1;font-size:13px;padding:8px;min-width:0}
#cp .r input{width:0;flex:1}
#bmp{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:62vh;overflow-y:auto}
#bmp label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;gap:8px}
#bmp input,#bmp select{font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#bmp input{width:90px}#bmp select{width:150px}
#bmp option{color:#1d2733;background:#fff}
#bmp textarea{width:100%;height:120px;box-sizing:border-box;font:13px/1.5 monospace;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px;-webkit-user-select:text;user-select:text}
#bmp .r{display:flex;gap:6px;margin:6px 0}
#bmp .r button{flex:1;font-size:13px;padding:8px;min-width:0}
#bmp .r input{width:0;flex:1}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:11px;white-space:nowrap;background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--fg)}
#dim{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px}
#dim label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
#dim input{width:110px;font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#dim .r{display:flex;gap:8px}
#dim .r button{flex:1;font-size:14px;padding:8px}
#tp,#bp{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:60vh;overflow-y:auto}
#tp label,#bp label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
#tp input,#tp select,#bp input,#bp select{width:130px;font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#tp option,#bp option{color:#1d2733;background:#fff}
#tp .r,#bp .r{display:flex;gap:8px}
#tp .r button,#bp .r button{flex:1;font-size:14px;padding:8px}
.pop button{flex:none;width:64px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;background:var(--bar)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#pal{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;justify-content:center;gap:8px}
#pal button{width:34px;height:34px;min-width:0;padding:0;border-radius:50%;border:2px solid var(--line)}
#pal button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--on)}
button.on{background:var(--on);color:var(--onfg);border-color:var(--on)}
</style>
</head>
<body>
<div class="top"><span id="hint"></span><div id="info"></div></div>
<div id="sa"><button id="sa-del">حذف</button><button id="sa-copy">نسخ</button><button id="sa-no">إلغاء التحديد</button></div>
<div id="bmp">
<label><span>طول الرافدة L (م)</span><input id="m-L" type="text" inputmode="decimal" dir="ltr" value="6"></label>
<label><span>المقطع: عرض × ارتفاع (م)</span><span><input id="m-b" type="text" inputmode="decimal" dir="ltr" value="0.25" style="width:62px"> × <input id="m-h" type="text" inputmode="decimal" dir="ltr" value="0.5" style="width:62px"></span></label>
<label><span>المادة</span><select id="m-E"><option value="30" selected>خرسانة (E = 30 GPa)</option><option value="210">فولاذ (E = 210 GPa)</option><option value="11">خشب (E = 11 GPa)</option></select></label>
<label><span>المسند المتحرك عند (م من الطرف الأيسر)</span><input id="m-s1" type="text" inputmode="decimal" dir="ltr" value="0"></label>
<label><span>المسند المفصلي عند (م من الطرف الأيسر)</span><input id="m-s2" type="text" inputmode="decimal" dir="ltr" value="6"></label>
<div style="font-size:12px;margin:6px 0 4px">حمل مركّز: القيمة P (ك.ن) والموضع a (م)</div>
<div class="r"><input id="m-pP" type="text" inputmode="decimal" dir="ltr" placeholder="P"><input id="m-pa" type="text" inputmode="decimal" dir="ltr" placeholder="a"><button id="m-padd">＋ مركّز</button><button id="m-pdel">حذف الأخير</button></div>
<textarea id="m-ptx" dir="ltr" spellcheck="false" placeholder="مثال: 50,3"></textarea>
<div style="font-size:12px;margin:6px 0 4px">حمل موزّع: الشدة w (ك.ن/م) من c إلى d (م)</div>
<div class="r"><input id="m-uw" type="text" inputmode="decimal" dir="ltr" placeholder="w"><input id="m-uc" type="text" inputmode="decimal" dir="ltr" placeholder="c"><input id="m-ud" type="text" inputmode="decimal" dir="ltr" placeholder="d"><button id="m-uadd">＋ موزّع</button><button id="m-udel">حذف الأخير</button></div>
<textarea id="m-utx" dir="ltr" spellcheck="false" placeholder="مثال: 20,1,4"></textarea>
<label><span>نسبة الأحمال %</span><span><button id="m-kminus" style="min-width:0;width:44px;padding:6px 0">−10</button> <input id="m-k" type="text" inputmode="decimal" dir="ltr" value="100" style="width:62px"> <button id="m-kplus" style="min-width:0;width:44px;padding:6px 0">+10</button></span></label>
<label><span>معامل تكبير الانحناء ×</span><input id="m-mag" type="text" inputmode="decimal" dir="ltr" value="200"></label>
<div id="m-info" style="font-size:13px;margin:6px 0"></div>
<div class="r"><button id="mok">وضع</button><button id="mno">إغلاق</button></div>
</div>
<div id="cp">
<label><span>عرض العمود b (م)</span><input id="c-b" type="text" inputmode="decimal" dir="ltr" value="0.25"></label>
<label><span>عمق العمود d (م)</span><input id="c-d" type="text" inputmode="decimal" dir="ltr" value="0.25"></label>
<label><span>شكل المقطع</span><select id="c-s"><option value="rect">مستطيل / مربع</option><option value="round">دائري (القطر = b)</option></select></label>
<label><span>الارتفاع (م) — 0 = مخطط أرضي</span><input id="c-h" type="text" inputmode="decimal" dir="ltr" value="0"></label>
<div class="r"><button id="c-flat">مخطط أرضي (0)</button><button id="c-up">ارفع الأعمدة (3 م)</button></div>
<label><span>عرض الأساس (م) — 0 = بدون</span><input id="c-f" type="text" inputmode="decimal" dir="ltr" value="1.2"></label>
<label><span>سمك الأساس (م)</span><input id="c-ft" type="text" inputmode="decimal" dir="ltr" value="0.5"></label>
<label><span>ربط الأعمدة بروافد</span><select id="c-bm"><option value="none" selected>بدون (أعمدة فقط)</option><option value="x">أفقي (x)</option><option value="y">شاقولي (y)</option><option value="grid">أفقي + شاقولي</option><option value="open">حسب الترتيب</option><option value="closed">حسب الترتيب + إغلاق</option></select></label>
<label><span>الرافدة: عرض × ارتفاع (م)</span><span><input id="c-bw" type="text" inputmode="decimal" dir="ltr" value="0.25" style="width:62px"> × <input id="c-bh" type="text" inputmode="decimal" dir="ltr" value="0.4" style="width:62px"></span></label>
<label><span>الأبعاد</span><select id="c-dm"><option value="off">بدون</option><option value="center" selected>بين المحاور (المراكز)</option><option value="net">بين وجوه الأعمدة (صافي)</option></select></label>
<label><span>البعد الكلي الخارجي</span><select id="c-tot"><option value="1" selected>مع</option><option value="0">بدون</option></select></label>
<div style="font-size:12px;margin:6px 0 4px">أضف الأعمدة بالترتيب: مركز كل عمود (x , y) بالمتر</div>
<div class="r"><input id="c-x" type="text" inputmode="decimal" dir="ltr" placeholder="x"><input id="c-y" type="text" inputmode="decimal" dir="ltr" placeholder="y"><button id="c-add">＋ عمود</button><button id="c-del">حذف الأخير</button></div>
<textarea id="c-txt" dir="ltr" spellcheck="false"></textarea>
<div id="c-info" style="font-size:13px;margin:6px 0"></div>
<div class="r"><button id="cok">وضع</button><button id="cno">إغلاق</button></div>
</div>
<div id="sp">
<label><span>النوع</span><select id="s-type"><option value="one">مستقيم بقلبة واحدة</option><option value="two">بقلبتين متوازيتين</option><option value="three">بثلاث قلبات متعامدة ومتوازية</option></select></label>
<label><span>ارتفاع الطابق (م)</span><input id="s-h" type="text" inputmode="decimal" dir="ltr" value="3.06"></label>
<label><span>عرض القلبة (م)</span><input id="s-w" type="text" inputmode="decimal" dir="ltr" value="1.2"></label>
<label><span style="display:flex;align-items:center;gap:6px"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M3 20h5v-5h5v-5h5v-5h3" opacity=".4"/><path d="M8 20v-5" stroke="#2a7fff" stroke-width="3.2"/></svg>القائمة h (سم)</span><input id="s-hc" class="sx" type="text" inputmode="decimal" dir="ltr"></label>
<label><span style="display:flex;align-items:center;gap:6px"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M3 20h5v-5h5v-5h5v-5h3" opacity=".4"/><path d="M8 15h5" stroke="#2a7fff" stroke-width="3.2"/></svg>النائمة g (سم)</span><input id="s-gc" class="sx" type="text" inputmode="decimal" dir="ltr"></label>
<div id="s-info" style="font-size:13px;margin:4px 0 8px"></div>
<label><span>عدد الدرجات (لكل قلبة)</span><span><button id="s-minus" style="min-width:0;width:36px;padding:6px 0">−</button> <input id="s-n" type="text" inputmode="numeric" dir="ltr" placeholder="تلقائي" style="width:72px"> <button id="s-plus" style="min-width:0;width:36px;padding:6px 0">+</button></span></label>
<label><span>سمك البلاطة (م)</span><input id="s-e" type="text" inputmode="decimal" dir="ltr" value="0.15"></label>
<div class="r"><button id="sok">وضع</button><button id="sno">إغلاق</button></div>
</div>
<div id="lbl"></div>
<div id="bp">
<label><span>النوع</span><select id="b-type"><option value="girder">جسر برافدات</option><option value="arch">جسر مقوّس</option><option value="cable">جسر بالكابلات</option></select></label>
<label><span>عدد الفتحات</span><input id="b-n" type="text" inputmode="decimal" dir="ltr" value="3"></label>
<label><span>طول الفتحة (م)</span><input id="b-span" type="text" inputmode="decimal" dir="ltr" value="12"></label>
<label><span>عرض الجسر (م)</span><input id="b-w" type="text" inputmode="decimal" dir="ltr" value="9"></label>
<label><span>ارتفاع الركائز (م)</span><input id="b-h" type="text" inputmode="decimal" dir="ltr" value="4"></label>
<label><span>عدد الرافدات</span><input id="b-g" type="text" inputmode="decimal" dir="ltr" value="4"></label>
<label><span>مقطع</span><select id="b-cut"><option value="none">بدون</option><option value="long">طولي (المتكأ)</option><option value="trans">عرضي (المكونات)</option></select></label>
<label><span>نوع الركيزة</span><select id="b-pier"><option value="col">أعمدة + عارضة</option><option value="wall">جدار</option></select></label>
<div class="r"><button id="bok">وضع</button><button id="bno">إغلاق</button></div>
</div>
<div id="tp">
<label><span>النوع</span><select id="t-type"><option value="warren">وارن</option><option value="pratt">برات</option><option value="howe">هاو</option><option value="roof">سقف مثلث</option></select></label>
<label><span>الفتحة (م)</span><input id="t-span" type="text" inputmode="decimal" dir="ltr" value="8"></label>
<label><span>الارتفاع (م)</span><input id="t-h" type="text" inputmode="decimal" dir="ltr" value="2"></label>
<label><span>عدد الفتحات</span><input id="t-n" type="text" inputmode="decimal" dir="ltr" value="4"></label>
<label><span>الحمل (ك.ن)</span><input id="t-p" type="text" inputmode="decimal" dir="ltr" value="10"></label>
<label><span>مكان الحمل</span><select id="t-mode"><option value="mid">في الوسط</option><option value="all">موزّع على العقد</option></select></label>
<label><span>مقطع القضيب (سم)</span><input id="t-w" type="text" inputmode="decimal" dir="ltr" value="16"></label>
<div class="r"><button id="tok">وضع</button><button id="tno">إغلاق</button></div>
</div>
<div id="dim">
<label><span id="dl-w">العرض</span><input id="dw" type="text" inputmode="decimal" dir="ltr"></label>
<label><span>العمق</span><input id="dd" type="text" inputmode="decimal" dir="ltr"></label>
<label><span>الارتفاع</span><input id="dh" type="text" inputmode="decimal" dir="ltr"></label>
<div class="r"><button id="dok">تطبيق</button><button id="dno">إغلاق</button></div>
</div>
<div id="pal"></div>
<div class="pop" id="p-cam">
<button data-tool="orbit" data-ic="orbit">تدوير</button>
<button data-tool="pan" data-ic="pan">إزاحة</button>
<button id="view" data-ic="view">منظر</button>
<button id="fitbtn" data-ic="fit">ملاءمة</button>
</div>
<div class="pop" id="p-draw">
<button data-tool="rect" data-ic="rect">مستطيل</button>
<button data-tool="circ" data-ic="circ">دائرة</button>
<button data-tool="wall" data-ic="wall">جدار</button>
<button data-tool="col" data-ic="col">عمود</button>
</div>
<div class="pop" id="p-mod">
<button data-tool="pull" data-ic="pull">سحب</button>
<button data-tool="move" data-ic="move">تحريك</button>
<button data-tool="rot" data-ic="rot">دوران</button>
<button id="copy" data-ic="copy">نسخ</button>
<button id="dimbtn" data-ic="dim">أبعاد</button>
<button id="stbtn" data-ic="steps">درجات</button>
<button id="rbtn" data-ic="riser">قائمة</button>
<button id="gbtn" data-ic="tread">نائمة</button>
<button id="csbtn" data-ic="cols">أعمدة</button>
<button id="bmbtn" data-ic="beam">رافدة</button>
</div>
<div class="pop" id="p-tools">
<button data-tool="meas" data-ic="meas">قياس</button>
<button data-tool="paint" data-ic="paint">تلوين</button>
<button data-tool="del" data-ic="del">حذف</button>
<button id="lbtn" data-ic="tag">أسماء</button>
</div>
<div class="pop" id="p-file">
<button id="save" data-ic="save">حفظ</button>
<button id="load" data-ic="load">فتح</button>
<button id="clear" data-ic="clear">مسح</button>
</div>
<div class="pop" id="p-lib">
<button data-lib="beam" data-ic="beam">رافدة</button>
<button data-lib="amph" data-ic="amph">مدرج</button>
<button data-lib="foot" data-ic="foot">أساس</button>
<button data-lib="frame" data-ic="frame">إطار</button>
<button data-lib="slab" data-ic="slab">بلاطة</button>
<button data-lib="truss" data-ic="truss">جمالون</button>
<button data-lib="bridge" data-ic="bridge">جسر</button>
<button data-lib="cols" data-ic="cols">أعمدة</button>
<button data-lib="sup" data-ic="sup">مسند</button>
<button data-lib="load" data-ic="load2">حمل</button>
</div>
<div class="bar">
<button data-tool="sel" data-ic="select">تحديد</button>
<button data-grp="cam" data-name="كاميرا" data-ic="orbit"></button>
<button data-grp="draw" data-name="رسم" data-ic="rect"></button>
<button data-grp="lib" data-name="مكتبة" data-ic="lib"></button>
<button data-grp="mod" data-name="تعديل" data-ic="pull"></button>
<button data-grp="tools" data-name="أدوات" data-ic="meas"></button>
<button id="undo" data-ic="undo">تراجع</button>
<button data-grp="file" data-name="ملف" data-ic="load"></button>
</div>

<script>

  document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\\/script>');

<script>
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const scene=new THREE.Scene();
scene.background=new THREE.Color(dark?0x1b2128:0xe8eef3);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,4000);

function place(k,g){
  const L=[],S=0x9aa5b1,B=0xd8c3a5,R=0xd1495b,x=g.x,z=g.z;
  const P=(dx,y,dz,w,h,d,c,cy)=>part(L,x+dx,y+(g.y||0),z+dz,w,h,d,c,cy);
  if(k==='beam'){buildBeam(L,x,z,g.y||0);}
  else if(k==='amph'){buildStairs(L,x,z,g.y||0);}
  else if(k==='cols'){buildCols(L,x,z,g.y||0);}
  else if(k==='stairs'){for(let i=0;i<10;i++)P(0,0,i*0.3-1.4,1.2,0.18*(i+1),0.3,B);}
  else if(k==='foot'){P(0,0,0,2,0.5,2,S);P(0,0.5,0,0.4,3,0.4,B);}
  else if(k==='frame'){P(-2,0,0,0.4,3,0.4,B);P(2,0,0,0.4,3,0.4,B);P(0,3,0,4.4,0.4,0.4,B);}
  else if(k==='sup'){P(0,0,0,0.8,0.8,0,S,2);}
  else if(k==='load'){P(0,0.4,0,0.1,1.4,0.1,R,1);P(0,0,0,0.35,0.4,0,R,3);}
  else if(k==='truss'){buildTruss(L,x,z,g.y||0);}
  else if(k==='bridge'){buildBridge(L,x,z,g.y||0);}
  else if(k==='truss0'){
    const M=(x1,y1,x2,y2,c)=>{
      const dx=x2-x1,dy=y2-y1,th=Math.atan2(dy,dx),t=0.16;
      part(L,x+(x1+x2)/2+Math.sin(th)*t/2,(g.y||0)+(y1+y2)/2-Math.cos(th)*t/2,z,Math.hypot(dx,dy),t,t,c);
      L[L.length-1].rotation.z=th;
    };
    const C=0x2a7fff,T=0xd1495b;
    P(-4,0,0,0.3,1,0.3,S);P(4,0,0,0.3,1,0.3,S);P(0,0,0,0.12,0.9,0.12,R,1);
    for(let i=0;i<4;i++)M(-4+2*i,1,-2+2*i,1,T);
    for(let j=0;j<3;j++)M(-3+2*j,3,-1+2*j,3,C);
    for(let j=0;j<4;j++){
      const lc=j<2?C:T,rc2=j<2?T:C;
      M(-4+2*j,1,-3+2*j,3,lc);M(-3+2*j,3,-2+2*j,1,rc2);
    }
  }
  else{[[-2,-2],[2,-2],[-2,2],[2,2]].forEach(a=>P(a[0],0,a[1],0.4,3,0.4,S));P(0,3,0,5,0.2,5,B);}
  undo.push({k:'multi',ms:L,lab:L.lab});select(null);
  if(k==='cols'||k==='bridge'||k==='truss'||k==='amph'||k==='beam')fitView(L);
  if(k==='truss'||k==='bridge'||k==='amph'||k==='cols'||k==='beam')flash(trMsg);
}

function solveSys(A,b){
  const n=b.length;
  for(let i=0;i<n;i++){
    let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
    [A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
    if(Math.abs(A[i][i])<1e-9)continue;
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];if(f){for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}
  }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=Math.abs(A[i][i])<1e-9?0:s/A[i][i];}
  return x;
}
function buildTruss(L,x,z,y0){

  const fits=d=>{
    camera.position.set(tx+d*Math.cos(pitch)*Math.sin(yaw),ty+d*Math.sin(pitch),tz+d*Math.cos(pitch)*Math.cos(yaw));
    camera.lookAt(tx,ty,tz);camera.updateMatrixWorld(true);

  };

function selDown(e){
  const m=pick(e);
  if(m){
    if(selSet.indexOf(m)<0)setSel([m]);
    const g=ground(e);
    if(!g)return;
    sst={mode:'move',hit:m,g0:g,orig:selSet.map(o=>[o,o.position.x,o.position.z]),done:false};
  }else{
    sst={mode:'box',x0:e.clientX,y0:e.clientY,x1:e.clientX,y1:e.clientY};
    rbDraw();
  }
}
function selMove(e){
  if(!sst)return;
  if(sst.mode==='move'){
    const g=ground(e);if(!g)return;
    const dx=g.x-sst.g0.x,dz=g.z-sst.g0.z;
    if(!sst.done&&(dx||dz)){undo.push({k:'mvset',o:sst.orig});sst.done=true;}
    if(sst.done)sst.orig.forEach(a=>{a[0].position.x=a[1]+dx;a[0].position.z=a[2]+dz;});
  }else{sst.x1=e.clientX;sst.y1=e.clientY;rbDraw();}
}
function selUp(e){
  const s=sst;sst=null;rb.style.display='none';
  if(!s)return;
  if(s.mode==='move'){if(!s.done)setSel([s.hit]);return;}
  if(Math.abs(s.x1-s.x0)<6&&Math.abs(s.y1-s.y0)<6){setSel([]);return;}

}

function readBM(){
  const v=id=>num(document.getElementById(id).value),L=Math.max(1,v('m-L')||6),mg=v('m-mag'),kk=v('m-k');
  let s1=v('m-s1'),s2=v('m-s2');
  if(!(s1===s1))s1=0;if(!(s2===s2))s2=L;
  s1=Math.min(L,Math.max(0,s1));s2=Math.min(L,Math.max(0,s2));
  if(Math.abs(s2-s1)<0.2){if(s1+0.2<=L)s2=s1+0.2;else s1=s2-0.2;}
  const ptTxt=document.getElementById('m-ptx').value,udTxt=document.getElementById('m-utx').value;
  const pn=parseNums(ptTxt),un=parseNums(udTxt),pl=[],ud=[];
  for(let i=0;i+1<pn.length;i+=2)pl.push({P:pn[i],a:Math.min(L,Math.max(0,pn[i+1]))});
  for(let i=0;i+2<un.length;i+=3){
    let c=Math.min(L,Math.max(0,un[i+1])),d=Math.min(L,Math.max(0,un[i+2]));
    if(c>d){const t=c;c=d;d=t;}
    if(d-c>0.01)ud.push({w:un[i],c,d});
  }
  return {L,b:Math.max(0.05,v('m-b')||0.25),h:Math.max(0.05,v('m-h')||0.5),E:+document.getElementById('m-E').value,s1,s2,k:(kk===kk)?Math.max(0,kk)/100:1,mag:(mg===mg)?Math.max(0,mg):200,pl,ud,ptTxt,udTxt};
}
function beamSolve(p){
  const L=p.L,EI=p.E*1e6*p.b*Math.pow(p.h,3)/12,N=240,s1=p.s1,s2=p.s2,k=p.k,dx=L/N;
  const pl=p.pl.map(q=>({P:q.P*k,a:q.a})),ud=p.ud.map(q=>({w:q.w*k,c:q.c,d:q.d}));
  let F=0,Mo=0;
  pl.forEach(q=>{F+=q.P;Mo+=q.P*(q.a-s1);});
  ud.forEach(q=>{const f=q.w*(q.d-q.c);F+=f;Mo+=f*((q.c+q.d)/2-s1);});
  const RB=Mo/(s2-s1),RA=F-RB,xs=[],M=[];
  for(let i=0;i<=N;i++){
    const x=L*i/N;let m=0;
    if(x>s1)m+=RA*(x-s1);
    if(x>s2)m+=RB*(x-s2);
    pl.forEach(q=>{if(x>q.a)m-=q.P*(x-q.a);});
    ud.forEach(q=>{if(x>q.c){const len=Math.min(x,q.d)-q.c;m-=q.w*len*(x-q.c-len/2);}});
    xs.push(x);M.push(m);
  }
  const I1=[0],I2=[0];
  for(let i=1;i<=N;i++){
    I1.push(I1[i-1]+(M[i-1]+M[i])/2*dx/EI);
    I2.push(I2[i-1]+(I1[i-1]+I1[i])/2*dx);
  }
  const lin=(arr,x)=>{if(x<=0)return arr[0];if(x>=L)return arr[N];const f=x/L*N,i=Math.floor(f),t=f-i;return arr[i]*(1-t)+arr[i+1]*t;};
  const C1=(lin(I2,s2)-lin(I2,s1))/(s2-s1),C2=lin(I2,s1)-C1*s1;
  const d=xs.map((x,i)=>-I2[i]+C1*x+C2);
  let dmax=0,Mmax=0;
  d.forEach(v=>{dmax=Math.max(dmax,Math.abs(v));});M.forEach(v=>{Mmax=Math.max(Mmax,Math.abs(v));});
  return {d,M,xs,RA,RB,dmax,Mmax,yd:x=>lin(d,x)};
}

function beamMesh(LL,x,y0,z,pts,h,b,color){
  const N=pts.length-1,th=[];
  for(let i=0;i<=N;i++){
    const a=pts[Math.max(0,i-1)],c=pts[Math.min(N,i+1)];
    th.push(Math.atan2(c[1]-a[1],c[0]-a[0]));
  }
  const hz=b/2,P=(i,t,zz)=>[pts[i][0]-Math.sin(th[i])*t*h/2,pts[i][1]+Math.cos(th[i])*t*h/2,zz];
  const pos=[],idx=[];
  const strip=(fa,fb)=>{
    const base=pos.length/3;
    for(let i=0;i<=N;i++){pos.push(...fa(i),...fb(i));}
    for(let i=0;i<N;i++){const q=base+2*i;idx.push(q,q+1,q+2,q+1,q+3,q+2);}
  };
  strip(i=>P(i,1,-hz),i=>P(i,1,hz));
  strip(i=>P(i,-1,hz),i=>P(i,-1,-hz));
  strip(i=>P(i,1,hz),i=>P(i,-1,hz));
  strip(i=>P(i,-1,-hz),i=>P(i,1,-hz));
  [0,N].forEach(i=>{
    const base=pos.length/3;
    pos.push(...P(i,1,-hz),...P(i,1,hz),...P(i,-1,hz),...P(i,-1,-hz));
    idx.push(base,base+1,base+2,base,base+2,base+3);
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();g.computeBoundingBox();
  const mesh=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide}));
  mesh.position.set(x,y0,z);mesh.userData.custom=true;
  const lp=[],poly=fa=>{for(let i=0;i<N;i++)lp.push(...fa(i),...fa(i+1));};
  poly(i=>P(i,1,-hz));poly(i=>P(i,1,hz));poly(i=>P(i,-1,-hz));poly(i=>P(i,-1,hz));
  [0,N].forEach(i=>{const q=[P(i,1,-hz),P(i,1,hz),P(i,-1,hz),P(i,-1,-hz)];for(let k=0;k<4;k++)lp.push(...q[k],...q[(k+1)%4]);});
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
  mesh.add(new THREE.LineSegments(lg,lineMat));
  scene.add(mesh);boxes.push(mesh);LL.push(mesh);
}
function buildBeamP(LL,x,z,y0,p){
  const Lc=p.L,b=p.b,h=p.h,yb=0.84,N=80;
  const col=p.E>=100?0x8fa0b3:(p.E<20?0xc4a070:0xc9cdd2),GS=0x9aa5b1,DK=0x4a5560,RD=0xd1495b;
  const sol=beamSolve(p),yd=sol.yd,f1=v=>String(+v.toFixed(1));
  let mag=p.mag,note='';
  const cap=Math.min(Lc/4,0.7);
  if(sol.dmax>0&&sol.dmax*mag>cap){mag=cap/sol.dmax;note=' (حُدّد التكبير ×'+mag.toFixed(0)+')';}
  const pts=[];
  for(let i=0;i<=N;i++){const xp=Lc*i/N;pts.push([-Lc/2+xp,yb+h/2-mag*yd(xp)]);}
  beamMesh(LL,x,y0,z,pts,h,b,col);
  const sw=b+0.3,X1=-Lc/2+p.s1,X2=-Lc/2+p.s2;
  part(LL,x+X1,y0,z,0.8,0.05,sw,GS);
  [-0.2,0.2].forEach(o=>part(LL,x+X1+o,y0+0.05,z,0.16,0.16,0.16,DK,4));
  part(LL,x+X1,y0+0.21,z,0.64,0.03,sw*0.6,GS);
  part(LL,x+X1,y0+0.24,z,0.5,0.6,0.5,GS,2);
  part(LL,x+X2,y0,z,0.8,0.05,sw,GS);
  part(LL,x+X2,y0+0.05,z,0.5,0.19,sw*0.6,GS);
  part(LL,x+X2,y0+0.24,z,0.5,0.6,0.5,GS,2);
  const topY=xp=>yb+h-mag*yd(xp);
  p.pl.forEach(q=>{
    if(!(q.P*p.k>0))return;
    const X=-Lc/2+q.a,ty=topY(q.a);
    part(LL,x+X,y0+ty,z,0.35,0.4,0.35,RD,3);
    part(LL,x+X,y0+ty+0.4,z,0.1,1.0,0.1,RD,1);
    addLabel(LL,'P = '+f1(q.P*p.k)+' ك.ن',x+X,y0+ty+1.7,z);
  });
  p.ud.forEach(q=>{
    if(!(q.w*p.k>0))return;
    const n=Math.max(2,Math.round((q.d-q.c)/0.4)),tails=[];
    for(let k=0;k<=n;k++){
      const xp=q.c+(q.d-q.c)*k/n,X=-Lc/2+xp,ty=topY(xp);
      part(LL,x+X,y0+ty,z,0.2,0.25,0.2,RD,3);
      part(LL,x+X,y0+ty+0.25,z,0.06,0.5,0.06,RD,1);
      tails.push(new THREE.Vector3(x+X,y0+ty+0.75,z));
    }
    const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(tails),new THREE.LineBasicMaterial({color:RD}));
    scene.add(ln);LL.push(ln);
    const xm=(q.c+q.d)/2;
    addLabel(LL,'w = '+f1(q.w*p.k)+' ك.ن/م',x-Lc/2+xm,y0+topY(xm)+1.2,z);
  });
  addLabel(LL,'مسند متحرك'+(sol.RA?' · RA='+f1(sol.RA):''),x+X1,y0-0.25,z);
  addLabel(LL,'مسند مفصلي'+(sol.RB?' · RB='+f1(sol.RB):''),x+X2,y0-0.25,z);
  const nl=p.pl.length+p.ud.length;
  trMsg='رافدة '+Lc+' م · '+(b*100).toFixed(0)+'×'+(h*100).toFixed(0)+' سم · مسند متحرك عند '+f1(p.s1)+' م ومفصلي عند '+f1(p.s2)+' م'+(nl?' · السهم الحقيقي '+(sol.dmax*1000).toFixed(2)+' مم'+note:' · أضف حملاً لتنحني');
}

function colLinks(pts,mode){

function buildColsP(L,x,z,y0,p){

  const CC=flat?0x2a3f8f:0xc9cdd2,FC=0xa9afb6,BC=flat?0x7fa6ff:0xc9cdd2,RD=0xe63946;

    if(p.shape==='round')part(L,x+q[0],y0+yb,z+q[1],p.b,ch,p.b,CC,1);

  });

      const a=pts[pr[0]],c=pts[pr[1]],dx=c[0]-a[0],dz=c[1]-a[1],len=Math.hypot(dx,dz);
      if(len<0.05)return;

    });
  }

      const len=b2-a2;if(len<0.02)return;

        addLabel(L,len.toFixed(2)+' م',x+m,ey+0.12,z+f,[[x+a2,ey,z+f],[x+b2,ey,z+f]]);
      }else{
        part(L,x+f,ey,z+m,0.02,0.02,len,RD);
        [a2,b2].forEach(v=>part(L,x+f,ey,z+v,tk,0.02,0.02,RD));
        addLabel(L,len.toFixed(2)+' م',x+f,ey+0.12,z+m,[[x+f,ey,z+a2],[x+f,ey,z+b2]]);
      }

    const net=p.dm==='net',segsX=[],segsY=[];

      for(let i=0;i+1<ys.length;i++)segsY.push([net?ys[i]+hz:ys[i],net?ys[i+1]-hz:ys[i+1]]);
    }
    const zc1=z0-off1,zc2=z0-off2,xc1=x0-off1,xc2=x0-off2;

    if(p.tot){dseg('x',zc2,x0,x1);dseg('z',xc2,z0,z1);posX.add(x0);posX.add(x1);posY.add(z0);posY.add(z1);}

  }
  const bmN={none:'',x:' · روافد أفقية',y:' · روافد شاقولية',grid:' · روافد أفقية وشاقولية',open:' · روافد بالترتيب',closed:' · روافد بالترتيب مغلقة'}[p.bm];
  trMsg=pts.length+' أعمدة · '+(flat?'مخطط أرضي — ارفع الأعمدة من خيار الارتفاع':'الارتفاع '+p.H+' م')+bmN+(p.dm==='off'?'':(p.dm==='net'?' · أبعاد بين الوجوه خارج المخطط':' · أبعاد بين المحاور خارج المخطط'))+(p.tot?' · البعد الكلي':'');
}

function buildStairsP(L,x,z,y0,p){
  const type=p.type;
  const Hf=p.Hf,w=p.w,e=p.e;
  const nf=type==='one'?1:type==='two'?2:3;

    const c=Math.cos(phi),s=Math.sin(phi),th=Math.atan2(r,t),Ls=Math.hypot(nt,fh);

      const u=(k+0.5)*t;

      L[L.length-1].rotation.y=-phi;
    }
    const um=nt/2+e*Math.sin(th),ym=fh/2-e*Math.cos(th);
    part(L,x+ox+um*c,y0+yb+ym,z+oz+um*s,Ls,e,w,B);
    const m=L[L.length-1];m.rotation.y=-phi;m.rotation.z=th;
    addLabel(L,'قلبة '+idx,x+ox+nt/2*c,y0+yb+fh/2+0.9,z+oz+nt/2*s);
  };
  const land=(cx,cz,top,lw,ld)=>{
    part(L,x+cx,y0+top-e,z+cz,lw,e,ld,CP);
    addLabel(L,'بسطة',x+cx,y0+top+0.5,z+cz);
  };

    flight(0,0,0,0,1);land(nt+0.6,0,fh,1.2,w);
  }else if(type==='two'){
    const g=0.1;
    flight(0,0,0,0,1);
    land(nt+w/2,(w+g)/2,fh,w,2*w+g);
    flight(nt,w+g,Math.PI,fh,2);
    land(-0.6,w+g,2*fh,1.2,w);
  }else{
    flight(0,0,0,0,1);
    land(nt+w/2,0,fh,w,w);
    flight(nt+w/2,w/2,Math.PI/2,fh,2);
    land(nt+w/2,w/2+nt+w/2,2*fh,w,w);
    flight(nt,w/2+nt+w/2,Math.PI,2*fh,3);

}

      if(g){
        const th=m.rotation.y,c=Math.cos(th),s=Math.sin(th),ddx=g.x-p.g0.x,ddz=g.z-p.g0.z;
        if(p.ax==='x'){const w=Math.max(0.1,p.w0+p.sg*(ddx*c-ddz*s));m.scale.x=w;const sh=p.sg*(w-p.w0)/2;m.position.x=p.x0+sh*c;m.position.z=p.z0-sh*s;}
        else{const d=Math.max(0.1,p.d0+p.sg*(ddx*s+ddz*c));m.scale.z=d;const sh=p.sg*(d-p.d0)/2;m.position.x=p.x0+sh*s;m.position.z=p.z0+sh*c;}
      }
    }
    showInfo(m.scale.x,m.scale.z,m.scale.y);
  }else if(sst){selMove(e);
  }else if(wl){
    const g=ground(e,wl.a.y);if(g){wl.b=g;wallPrev();}
  }else if(cr){
    const g=ground(e,cr.c.y);if(g){cr.b=g;circPrev();}
  }else if(rt){
    const q=Math.PI/12;
    if(!rt.done){undo.push({k:'rot',m:rt.m,r:rt.r0});rt.done=true;}
    rt.m.rotation.y=Math.round((rt.r0-(e.clientX-rt.x0)*0.01)/q)*q;
  }else if(ms){
    const g=ground(e,ms.a.y);if(g)measUpdate(g);
  }else if(mv){
    const g=ground(e);
    if(g){
      if(!mv.done){undo.push({k:'mv',m:mv.m,x:mv.x0,z:mv.z0});mv.done=true;}
      mv.m.position.x=mv.x0+g.x-mv.g0.x;mv.m.position.z=mv.z0+g.z-mv.g0.z;
    }
  }else if(rot){
    if(tool==='pan'){
      const k=dist*0.0015;
      tx+=-dx*k*Math.cos(yaw)-dy*k*Math.sin(yaw);
      tz+=dx*k*Math.sin(yaw)-dy*k*Math.cos(yaw);
    }else{yaw-=dx*0.01;pitch=clamp(pitch+dy*0.01,0.05,1.5);}
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(sst)selUp(e);
  if(drawing)finishRect();
  if(cr)finishCirc();
  pull=null;mv=null;ms=null;rt=null;rot=false;
}
el.addEventListener('pointerup',up);
el.addEventListener('pointercancel',up);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

setTool('orbit');
(function loop(){
  camera.position.set(
    tx+dist*Math.cos(pitch)*Math.sin(yaw),
    ty+dist*Math.sin(pitch),
    tz+dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(tx,ty,tz);
  updLabels();renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
