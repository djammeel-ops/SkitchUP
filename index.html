<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورشة ثلاثية الأبعاد</title>
<style>
:root{--bar:#ffffffee;--fg:#1d2733;--line:#c9d3dd;--on:#2a7fff;--onfg:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar:#232b34ee;--fg:#e8edf2;--line:#3a4654;--on:#4d9bff;--onfg:#0b1220}}
:root[data-theme="dark"]{--bar:#232b34ee;--fg:#e8edf2;--line:#3a4654;--on:#4d9bff;--onfg:#0b1220}
html,body{height:100%;margin:0;overflow:hidden;background:#e8eef3;font-family:system-ui,Tahoma,"Segoe UI",sans-serif;color:var(--fg);-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;text-align:center;font-size:14px;pointer-events:none}
.top span{display:inline-block;background:var(--bar);padding:6px 12px;border-radius:14px;border:1px solid var(--line)}
#info{margin-top:6px;font-size:13px;min-height:20px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:space-around;padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bar);border-top:1px solid var(--line)}
button{flex:none;min-width:62px;padding:10px 8px;font:inherit;font-size:13px;white-space:nowrap;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px}
.bar button{flex:1;max-width:72px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px}
.pop{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;justify-content:center;gap:6px;padding:0 8px;flex-wrap:wrap}
.pop.open{display:flex}
#lbl{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
#sp{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:60vh;overflow-y:auto}
#sp label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
#sp input,#sp select{font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#sp input{width:110px}#sp select{width:190px}
#sp option{color:#1d2733;background:#fff}
#sp .r{display:flex;gap:8px}
#sp .r button{flex:1;font-size:14px;padding:8px}
#hp{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:62vh;overflow-y:auto}
#hp label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;gap:8px}
#hp input{width:90px;font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#hp textarea{width:100%;height:170px;box-sizing:border-box;font:13px/1.5 monospace;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px;-webkit-user-select:text;user-select:text}
#hp .r{display:flex;gap:8px;margin:6px 0}
#hp .r button{flex:1;font-size:14px;padding:8px}
#sa{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;justify-content:center;gap:8px}
#sa button{flex:none;min-width:72px;background:var(--bar);padding:8px 10px;font-size:13px}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:11px;white-space:nowrap;background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--fg)}
#dim{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px}
#dim label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
#dim input{width:110px;font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#dim .r{display:flex;gap:8px}
#dim .r button{flex:1;font-size:14px;padding:8px}
#tp,#bp{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:60vh;overflow-y:auto}
#tp label,#bp label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
#tp input,#tp select,#bp input,#bp select{width:130px;font:inherit;font-size:16px;padding:6px 8px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;text-align:center;-webkit-user-select:text;user-select:text}
#tp option,#bp option{color:#1d2733;background:#fff}
#tp .r,#bp .r{display:flex;gap:8px}
#tp .r button,#bp .r button{flex:1;font-size:14px;padding:8px}
.pop button{flex:none;width:64px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;background:var(--bar)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#pal{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;justify-content:center;gap:8px}
#pal button{width:34px;height:34px;min-width:0;padding:0;border-radius:50%;border:2px solid var(--line)}
#pal button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--on)}
button.on{background:var(--on);color:var(--onfg);border-color:var(--on)}
</style>
</head>
<body>
<div class="top"><span id="hint"></span><div id="info"></div></div>
<div id="sa"><button id="sa-del">حذف</button><button id="sa-copy">نسخ</button><button id="sa-no">إلغاء التحديد</button></div>
<div id="hp">
<label><span>ارتفاع الجدران (م) — 0 = مخطط</span><input id="h-h" type="text" inputmode="decimal" dir="ltr" value="0"></label>
<div class="r"><button id="h-flat">مخطط ثنائي</button><button id="h-up">ارفع الجدران</button></div>
<label><span>سمك الجدار (م)</span><input id="h-t" type="text" inputmode="decimal" dir="ltr" value="0.2"></label>
<div style="font-size:12px;margin:2px 0 4px">كل سطر غرفة: اسم x y عرض عمق · أو فتحة: باب/نافذة x y عرض (بالمتر)</div>
<textarea id="h-txt" dir="ltr" spellcheck="false"></textarea>
<div id="h-info" style="font-size:13px;margin:6px 0"></div>
<div class="r"><button id="hok">وضع</button><button id="hno">إغلاق</button></div>
</div>
<div id="sp">
<label><span>النوع</span><select id="s-type"><option value="one">مستقيم بقلبة واحدة</option><option value="two">بقلبتين متوازيتين</option><option value="three">بثلاث قلبات متعامدة ومتوازية</option></select></label>
<label><span>ارتفاع الطابق (م)</span><input id="s-h" type="text" inputmode="decimal" dir="ltr" value="3.06"></label>
<label><span>عرض القلبة (م)</span><input id="s-w" type="text" inputmode="decimal" dir="ltr" value="1.2"></label>
<label><span style="display:flex;align-items:center;gap:6px"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M3 20h5v-5h5v-5h5v-5h3" opacity=".4"/><path d="M8 20v-5" stroke="#2a7fff" stroke-width="3.2"/></svg>القائمة h (سم)</span><input id="s-hc" class="sx" type="text" inputmode="decimal" dir="ltr"></label>
<label><span style="display:flex;align-items:center;gap:6px"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M3 20h5v-5h5v-5h5v-5h3" opacity=".4"/><path d="M8 15h5" stroke="#2a7fff" stroke-width="3.2"/></svg>النائمة g (سم)</span><input id="s-gc" class="sx" type="text" inputmode="decimal" dir="ltr"></label>
<div id="s-info" style="font-size:13px;margin:4px 0 8px"></div>
<label><span>عدد الدرجات (لكل قلبة)</span><span><button id="s-minus" style="min-width:0;width:36px;padding:6px 0">−</button> <input id="s-n" type="text" inputmode="numeric" dir="ltr" placeholder="تلقائي" style="width:72px"> <button id="s-plus" style="min-width:0;width:36px;padding:6px 0">+</button></span></label>
<label><span>سمك البلاطة (م)</span><input id="s-e" type="text" inputmode="decimal" dir="ltr" value="0.15"></label>
<div class="r"><button id="sok">وضع</button><button id="sno">إغلاق</button></div>
</div>
<div id="lbl"></div>
<div id="bp">
<label><span>النوع</span><select id="b-type"><option value="girder">جسر برافدات</option><option value="arch">جسر مقوّس</option><option value="cable">جسر بالكابلات</option></select></label>
<label><span>عدد الفتحات</span><input id="b-n" type="text" inputmode="decimal" dir="ltr" value="3"></label>
<label><span>طول الفتحة (م)</span><input id="b-span" type="text" inputmode="decimal" dir="ltr" value="12"></label>
<label><span>عرض الجسر (م)</span><input id="b-w" type="text" inputmode="decimal" dir="ltr" value="9"></label>
<label><span>ارتفاع الركائز (م)</span><input id="b-h" type="text" inputmode="decimal" dir="ltr" value="4"></label>
<label><span>عدد الرافدات</span><input id="b-g" type="text" inputmode="decimal" dir="ltr" value="4"></label>
<label><span>مقطع</span><select id="b-cut"><option value="none">بدون</option><option value="long">طولي (المتكأ)</option><option value="trans">عرضي (المكونات)</option></select></label>
<label><span>نوع الركيزة</span><select id="b-pier"><option value="col">أعمدة + عارضة</option><option value="wall">جدار</option></select></label>
<div class="r"><button id="bok">وضع</button><button id="bno">إغلاق</button></div>
</div>
<div id="tp">
<label><span>النوع</span><select id="t-type"><option value="warren">وارن</option><option value="pratt">برات</option><option value="howe">هاو</option><option value="roof">سقف مثلث</option></select></label>
<label><span>الفتحة (م)</span><input id="t-span" type="text" inputmode="decimal" dir="ltr" value="8"></label>
<label><span>الارتفاع (م)</span><input id="t-h" type="text" inputmode="decimal" dir="ltr" value="2"></label>
<label><span>عدد الفتحات</span><input id="t-n" type="text" inputmode="decimal" dir="ltr" value="4"></label>
<label><span>الحمل (ك.ن)</span><input id="t-p" type="text" inputmode="decimal" dir="ltr" value="10"></label>
<label><span>مكان الحمل</span><select id="t-mode"><option value="mid">في الوسط</option><option value="all">موزّع على العقد</option></select></label>
<label><span>مقطع القضيب (سم)</span><input id="t-w" type="text" inputmode="decimal" dir="ltr" value="16"></label>
<div class="r"><button id="tok">وضع</button><button id="tno">إغلاق</button></div>
</div>
<div id="dim">
<label><span id="dl-w">العرض</span><input id="dw" type="text" inputmode="decimal" dir="ltr"></label>
<label><span>العمق</span><input id="dd" type="text" inputmode="decimal" dir="ltr"></label>
<label><span>الارتفاع</span><input id="dh" type="text" inputmode="decimal" dir="ltr"></label>
<div class="r"><button id="dok">تطبيق</button><button id="dno">إغلاق</button></div>
</div>
<div id="pal"></div>
<div class="pop" id="p-cam">
<button data-tool="orbit" data-ic="orbit">تدوير</button>
<button data-tool="pan" data-ic="pan">إزاحة</button>
<button id="view" data-ic="view">منظر</button>
</div>
<div class="pop" id="p-draw">
<button data-tool="rect" data-ic="rect">مستطيل</button>
<button data-tool="circ" data-ic="circ">دائرة</button>
<button data-tool="wall" data-ic="wall">جدار</button>
<button data-tool="col" data-ic="col">عمود</button>
</div>
<div class="pop" id="p-mod">
<button data-tool="pull" data-ic="pull">سحب</button>
<button data-tool="move" data-ic="move">تحريك</button>
<button data-tool="rot" data-ic="rot">دوران</button>
<button id="copy" data-ic="copy">نسخ</button>
<button id="dimbtn" data-ic="dim">أبعاد</button>
<button id="stbtn" data-ic="steps">درجات</button>
<button id="rbtn" data-ic="riser">قائمة</button>
<button id="gbtn" data-ic="tread">نائمة</button>
<button id="hsbtn" data-ic="house">منزل</button>
</div>
<div class="pop" id="p-tools">
<button data-tool="meas" data-ic="meas">قياس</button>
<button data-tool="paint" data-ic="paint">تلوين</button>
<button data-tool="del" data-ic="del">حذف</button>
<button id="lbtn" data-ic="tag">أسماء</button>
</div>
<div class="pop" id="p-file">
<button id="save" data-ic="save">حفظ</button>
<button id="load" data-ic="load">فتح</button>
<button id="clear" data-ic="clear">مسح</button>
</div>
<div class="pop" id="p-lib">
<button data-lib="beam" data-ic="beam">رافدة</button>
<button data-lib="bend" data-ic="bend">انحناء</button>
<button data-lib="amph" data-ic="amph">مدرج</button>
<button data-lib="foot" data-ic="foot">أساس</button>
<button data-lib="frame" data-ic="frame">إطار</button>
<button data-lib="slab" data-ic="slab">بلاطة</button>
<button data-lib="truss" data-ic="truss">جمالون</button>
<button data-lib="bridge" data-ic="bridge">جسر</button>
<button data-lib="house" data-ic="house">منزل</button>
<button data-lib="sup" data-ic="sup">مسند</button>
<button data-lib="load" data-ic="load2">حمل</button>
</div>
<div class="bar">
<button data-tool="sel" data-ic="select">تحديد</button>
<button data-grp="cam" data-name="كاميرا" data-ic="orbit"></button>
<button data-grp="draw" data-name="رسم" data-ic="rect"></button>
<button data-grp="lib" data-name="مكتبة" data-ic="lib"></button>
<button data-grp="mod" data-name="تعديل" data-ic="pull"></button>
<button data-grp="tools" data-name="أدوات" data-ic="meas"></button>
<button id="undo" data-ic="undo">تراجع</button>
<button data-grp="file" data-name="ملف" data-ic="load"></button>
</div>
<div id="startup-error" role="alert" aria-live="assertive" style="display:none;position:fixed;inset:0;z-index:9999;box-sizing:border-box;padding:28px 20px;background:#f4f7fa;color:#1d2733;font:16px/1.7 system-ui,Tahoma,sans-serif;text-align:center;align-content:center;justify-content:center">
  <div style="max-width:520px;margin:auto">
    <h2 style="margin:0 0 12px">تعذر تشغيل الورشة ثلاثية الأبعاد</h2>
    <p id="startup-error-message" style="margin:0 0 18px">تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.</p>
    <button type="button" onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:10px;background:#2a7fff;color:white;font:inherit">إعادة المحاولة</button>
  </div>
</div>
<script>
function showStartupError(message){
  const panel=document.getElementById('startup-error');
  const detail=document.getElementById('startup-error-message');
  if(detail)detail.textContent=message;
  if(panel){panel.style.display='grid';panel.style.display='flex';}
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="showStartupError('تعذر تحميل مكتبة العرض ثلاثي الأبعاد. تحقق من اتصال الإنترنت أو جرّب لاحقاً.')"></script>
<script>
if(!window.THREE){
  showStartupError('لم يتم تحميل مكتبة Three.js اللازمة للتشغيل. تحقق من اتصال الإنترنت ثم أعد المحاولة.');
  throw new Error('Three.js failed to load');
}
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const scene=new THREE.Scene();
scene.background=new THREE.Color(dark?0x1b2128:0xe8eef3);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,300);
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
}catch(error){
  showStartupError('المتصفح أو الجهاز لا يدعم تشغيل WebGL المطلوب لعرض المجسمات. جرّب متصفحاً حديثاً أو فعّل تسريع الرسوميات.');
  throw error;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const el=renderer.domElement;

const grid=new THREE.GridHelper(40,40,dark?0x6d7b8a:0x8a99a8,dark?0x34404c:0xc3ced8);
grid.position.y=-0.01;scene.add(grid);
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const sun=new THREE.DirectionalLight(0xffffff,0.75);
sun.position.set(6,12,8);scene.add(sun);

const unit=new THREE.BoxGeometry(1,1,1);unit.translate(0,0.5,0);
const edges=new THREE.EdgesGeometry(unit);
const lineMat=new THREE.LineBasicMaterial({color:dark?0xdde6ee:0x2b3540});
const boxes=[],undo=[];
let sel=null,tool='orbit',drawing=null,pull=null,mv=null,ms=null,wl=null,cr=null,rt=null,pinch=null,rot=false;
let yaw=0.8,pitch=0.6,dist=12,tx=0,tz=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const snap=v=>Math.round(v*2)/2;

const preview=new THREE.Mesh(unit,new THREE.MeshBasicMaterial({color:0x2a7fff,transparent:true,opacity:0.45}));
preview.visible=false;scene.add(preview);

function addBox(x,z,w,d,h){
  const m=new THREE.Mesh(unit,new THREE.MeshLambertMaterial({color:0xd8c3a5}));
  m.add(new THREE.LineSegments(edges,lineMat));
  m.rotation.order='YXZ';m.position.set(x,0,z);m.scale.set(w,h,d);
  scene.add(m);boxes.push(m);return m;
}
const info=document.getElementById('info'),hint=document.getElementById('hint');
function showInfo(w,d,h){info.innerHTML='<span>العرض '+w.toFixed(1)+' م · العمق '+d.toFixed(1)+' م · الارتفاع '+h.toFixed(1)+' م</span>';}
function select(m){
  if(sel)sel.material.emissive.setHex(0);
  sel=m;
  if(m){m.material.emissive.setHex(0x1a3a66);showInfo(m.scale.x,m.scale.z,m.scale.y);
    if(m.userData.N!==undefined){const n=m.userData.N;info.innerHTML='<span>طول '+m.scale.x.toFixed(2)+' م · القوة '+Math.abs(n).toFixed(1)+' ك.ن ('+(n>0.05?'شد':n<-0.05?'ضغط':'صفر')+')</span>';}
  }else info.innerHTML='';
}
const HINTS={orbit:'اسحب بإصبع للتدوير وبإصبعين للتكبير',rect:'اسحب على الأرضية أو على سطح مجسم لرسم مستطيل',pull:'المس وجهاً ثم اسحب: العلوي للارتفاع والجانبي للعرض',move:'اسحب مجسماً لتحريكه على الأرضية',paint:'اختر لوناً ثم المس مجسماً',del:'المس مجسماً لحذفه',col:'المس الأرضية لوضع عمود أسطواني',meas:'اسحب بين نقطتين على الأرضية لقياس المسافة',wall:'اسحب على الأرضية لرسم جدار (سمك 0.2 م، ارتفاع 3 م)',circ:'اسحب من المركز لرسم دائرة (أسطوانة)',rot:'اسحب مجسماً يميناً أو يساراً لتدويره',pan:'اسحب لتحريك الكاميرا',lib:'المس الأرضية لوضع العنصر',sel:'المس مجسماً لتحديده · اسحب مستطيلاً: يميناً = تحديد كامل، يساراً = بالتقاطع'};
function cancelOps(){drawing=null;pull=null;mv=null;ms=null;wl=null;cr=null;rt=null;sst=null;rb.style.display='none';rot=false;mline.visible=false;preview.rotation.y=0;preview.visible=false;}
function setTool(t){
  tool=t;cancelOps();if(t!=='sel'&&selSet.length)setSel([]);
  document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  hint.textContent=HINTS[t];pal.style.display=t==='paint'?'flex':'none';syncGroups(t);
}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.getElementById('undo').onclick=()=>{
  const u=undo.pop();if(!u)return;
  if(u.k==='add'){scene.remove(u.m);boxes.splice(boxes.indexOf(u.m),1);if(sel===u.m)select(null);}

function rmLabel(l){l.d.remove();const i=labels.indexOf(l);if(i>=0)labels.splice(i,1);}

function buildBridge(L,x,z,y0){
  const v=id=>num(document.getElementById(id).value);
  const type=document.getElementById('b-type').value;
  let n=Math.max(1,Math.min(5,Math.round(v('b-n')||3)));
  const Ls=Math.max(4,v('b-span')||12),W=Math.max(5,v('b-w')||9),H=Math.max(1,v('b-h')||4);
  const ng=type==='cable'?2:Math.max(2,Math.min(8,Math.round(v('b-g')||4)));
  if(type==='cable')n=2;
  const C=0xb9bfc6,CP=0xc9cdd2,AS=0x353a40,FL=0x9c7a54,WH=0xf4f4f4,BR=0x222831,RL=0x7a8896,SW=0xcfd4da;
  const tot=n*Ls,xs=i=>-tot/2+i*Ls,sw=1.2,tdk=0.25;
  const f=Math.max(1.5,Ls*0.25),ys=0.8+H;
  const yd=type==='arch'?ys+f+1:3.15+H,yt=yd+tdk,Lr=tot+13.2;
  const cut=document.getElementById('b-cut').value;const pw=document.getElementById('b-pier').value==='wall';let zi=0;
  const P=(dx,y,dz,w,h,d,c,cy)=>{
    const e=(zi++)*0.0007;
    if(cut==='long'){
      if(cy){if(dz>0.01)return;}
      else{const a=dz-d/2,b=Math.min(dz+d/2,-e);if(b-a<=0.002)return;part(L,x+dx,y0+y,z+(a+b)/2,w,h,b-a,c,cy);return;}
    }else if(cut==='trans'){
      if(cy){if(dx>0.01)return;}
      else{const a=dx-w/2,b=Math.min(dx+w/2,-e);if(b-a<=0.002)return;part(L,x+(a+b)/2,y0+y,z+dz,b-a,h,d,c,cy);return;}
    }
    part(L,x+dx,y0+y,z+dz,w,h,d,c,cy);
  };
  const M=(x1,y1,x2,y2,zz,d,t,c)=>{
    const ddx=x2-x1,ddy=y2-y1,th=Math.atan2(ddy,ddx);
    let zz2=z+zz,dd=d;
    if(cut==='long'){const a=zz-d/2,b=Math.min(zz+d/2,0);if(b-a<=0.002)return;zz2=z+(a+b)/2;dd=b-a;}
    if(cut==='trans'&&(x1+x2)/2>0)return;
    part(L,x+(x1+x2)/2+Math.sin(th)*t/2,y0+(y1+y2)/2-Math.cos(th)*t/2,zz2,Math.hypot(ddx,ddy),t,dd,c);
    L[L.length-1].rotation.z=th;
  };
  // دعامات طرفية + أساسات + ردم + جدران جناحية
  for(const i of [0,n]){
    const sg=i===0?-1:1,fx=xs(i)+sg*3.6;
    P(xs(i),-0.1,0,3,0.1,W+1.4,0x8a8f95);
    P(xs(i),0,0,2.6,0.8,W+1,C);
    P(xs(i),0.8,0,1.2,H+1,W,CP);
    P(xs(i)+sg*0.4,1.8+H,0,0.4,yt-1.8-H,W-0.04,CP);
    P(xs(i)+sg*0.75,yt-0.75,0,0.3,0.25,W-0.04,C);
    M(xs(i)+sg*0.6,yt-0.35,xs(i)+sg*5.6,yt-0.85,0,W-0.04,0.3,C);
    P(xs(i)+sg*3.6,yt-0.2,0,6,0.2,W-0.04,0x7a7f85);
    P(fx,0,0,6,yt-0.2,W-0.04,FL);
    P(fx,0,W/2+0.15,6,yt,0.3,C);P(fx,0,-W/2-0.15,6,yt,0.3,C);
  }
  // الركائز الوسيطة
  const cc=W>8?3:2,zc=j=>(j-(cc-1)/2)*((W-2.5)/(cc-1));
  for(let i=1;i<n;i++){
    if(type==='arch'||pw){P(xs(i),0,0,2.6,0.8,W-1,C);P(xs(i),0.8,0,1.4,H+(type==='arch'?0:1),W-1.5,CP);}
    else{
      for(let j=0;j<cc;j++){P(xs(i),0,zc(j),2.4,0.8,2.4,C);P(xs(i),0.8,zc(j),1.2,H,1.2,CP,1);}
      P(xs(i),0.8+H,0,1.4,1,W-0.4,C);
    }
  }
  if(type!=='arch'){
    const gz=j=>(j-(ng-1)/2)*((W-1.5)/(ng-1));
    for(let i=0;i<=n;i++)for(let j=0;j<ng;j++)P(xs(i),1.8+H,gz(j),0.4,0.15,0.4,BR);
    for(let j=0;j<ng;j++)P(0,1.95+H,gz(j),tot+0.4,1.2,0.5,C);
    for(let i=0;i<=n;i++)P(xs(i),1.95+H,0,0.3,1,W-1.2,C);
    for(let i=0;i<n;i++)P(xs(i)+Ls/2,1.95+H,0,0.25,0.9,W-1.2,C);
  }
  if(type==='arch'){
    const seg=12,thk=0.7,aw=W-1.5,ps=Math.max(1,Math.floor(Ls/2.5));
    for(let s=0;s<n;s++){
      const ay=t=>ys+4*f*t*(1-t);
      for(let k=0;k<seg;k++)M(xs(s)+Ls*k/seg,ay(k/seg),xs(s)+Ls*(k+1)/seg,ay((k+1)/seg),0,aw,thk,C);
      for(let k=1;k<=ps;k++){
        const t=k/(ps+1),ya=ay(t)+thk*0.5;
        [-1,1].forEach(sg=>P(xs(s)+Ls*t,ya,sg*(aw/2-0.3),0.4,yd-ya,0.4,C));
      }
    }
  }
  if(type==='cable'){
    const Ht=Math.max(6,Ls*0.8),xt=xs(1),top=1.8+H+Ht,sp2=(Ls-1.5)/5,zt=W/2-0.6;
    [-1,1].forEach(sg=>P(xt,1.8+H,sg*zt,0.9,Ht,0.9,C));
    P(xt,top-0.8,0,0.9,0.6,W-1.2,C);
    for(let k=1;k<=5;k++){
      const ax=1.5+sp2*(k-1),ya=top-0.3-0.8*(5-k);
      [-1,1].forEach(sx=>[-1,1].forEach(sz=>M(xt,ya,xt+sx*ax,yt,sz*zt,0.08,0.08,WH)));
    }
  }
  // بلاطة الممر + طبقة الإسفلت + الأرصفة + الحواجز + التشوير
  P(0,yd,0,tot+0.4,tdk,W,C);
  P(0,yt,0,Lr,0.03,W-2*sw,0x1e1e1e);P(0,yt+0.03,0,Lr,0.08,W-2*sw,AS);
  P(0,yt+0.11,W/2-sw-0.2,Lr,0.02,0.1,WH);P(0,yt+0.11,-(W/2-sw-0.2),Lr,0.02,0.1,WH);
  for(let xp=-Lr/2+2;xp<Lr/2-1;xp+=4)P(xp,yt+0.11,0,2,0.02,0.15,WH);
  [-1,1].forEach(sg=>{
    P(0,yt,sg*(W/2-sw),Lr,0.25,0.12,C);
    P(0,yt,sg*(W/2-0.3),Lr,0.25,0.1,C);
    P(0,yt,sg*(W/2-sw/2),Lr,0.05,sw,0xe3d3a0);
    for(let k=-1;k<=1;k++)P(0,yt+0.05,sg*(W/2-0.6+k*0.2),Lr,0.1,0.1,[0x2a7fff,0xd1495b,0xf2c14e][k+1]);
    P(0,yt+0.2,sg*(W/2-0.745),Lr,0.05,0.78,SW);
    P(0,yt,sg*(W/2-0.1),Lr,0.5,0.2,C);
    for(let xp=-Lr/2+1;xp<=Lr/2-0.5;xp+=3)P(xp,yt+0.5,sg*(W/2-0.1),0.12,0.8,0.12,RL);
    P(0,yt+1.25,sg*(W/2-0.1),Lr,0.08,0.1,RL);
    P(0,yt+0.9,sg*(W/2-0.1),Lr,0.05,0.06,RL);
  });
  if(cut!=='none'){
    const seg=(a,b,c2,d2)=>{
      const w=Math.max(Math.abs(c2-a),0.03),h=Math.max(Math.abs(d2-b),0.03),cx=(a+c2)/2,yb=Math.min(b,d2);
      if(cut==='trans')part(L,x+0.3,y0+yb,z+cx,0.03,h,w,0x555555);
      else part(L,x+cx,y0+yb,z+0.3,w,h,0.03,0x555555);
    };
    const ann=(t,a,b,la,lb)=>{
      seg(a,b,a,lb);seg(a,lb,la,lb);
      if(cut==='trans')addLabel(L,t,x+0.3,y0+lb,z+la);else addLabel(L,t,x+la,y0+lb,z+0.3);
    };
    const top=1.8+H;
    if(cut==='long'){
      const xa=xs(0);
      ann('الجدار الواقي',xa-0.4,yt-0.8,xa-0.4,yt+1.9);
      ann('مسند البلاطة الانتقالية',xa-0.75,yt-0.62,xa-2.3,yt+2.7);
      ann('البلاطة الإنتقالية',xa-3.1,yt-0.6,xa-3.1,yt+1.9);
      ann('طبقة الأساس والإسفلت',xa-5.2,yt+0.1,xa-5.2,yt+2.7);
      ann('ردم خلفي مدموك',xa-4.5,(yt-0.5)/2,xa-4.5,-1);
      ann('الأساس (القاعدة)',xa-0.8,0.4,xa-0.8,-1);
      ann('خرسانة النظافة',xa+0.8,-0.05,xa+0.8,-2);
      ann('الجدار الراجع (المقابل)',xa-6.2,yt/2,xa-4,-2);
      ann('الجدار الأمامي (الجبهي)',xa+0.3,0.8+(H+1)/2,xa+2.5,0.8+(H+1)/2);
      if(type!=='arch'){
        ann('جهاز الاستناد (نيوبران)',xa,top+0.075,xa+2.5,top-0.6);
        ann('رافدة',xa+Ls/2,top+0.75,xa+Ls/2,yt+1.9);
      }
      ann('بلاطة سطح الجسر',xa+2.5,yd+0.12,xa+2.5,yt+2.7);
      if(n>1)ann('ركيزة وسطية',xs(1),0.8+H/2,xs(1),-1);
    }else{
      const gz0=-(W-1.5)/2,cx=-W/2-2.4,rx=W/2+2.2;
      ann('حاجز أمني',W/2-0.1,yt+1.25,rx,yt+3.0);
      ann('كرنيشة',W/2-0.1,yt+0.35,rx,yt+2.3);
      ann('الحافة الداخلية',W/2-0.3,yt+0.2,rx,yt+1.6);
      ann('بلاطة الرصيف',W/2-0.745,yt+0.22,rx,yt+0.9);
      ann('أنابيب الشبكات المختلفة',W/2-0.6,yt+0.1,rx,yt-0.6);
      ann('طبقة رملية',W/2-0.9,yt+0.02,rx,yt-1.3);
      ann('حافة الرصيف',W/2-sw,yt+0.15,W/2-sw,yt+2.6);
      ann('طبقة السير',-W/4,yt+0.1,-W/4,yt+3.0);
      ann('الطبقة العازلة',0,yt+0.015,0,yt+2.0);
      ann('بلاطة سطح الجسر',-W/2+0.5,yd+0.12,cx,yd+0.12);
      if(type!=='arch'){
        ann('رافدة',gz0,1.95+H+0.6,cx,1.95+H+0.6);
        ann('جهاز الاستناد (نيوبران)',gz0,1.875+H,cx,1.1+H);
        if(n%2===0){
          if(!pw)ann('عارضة (رأس الركيزة)',-W/2+0.5,top+0.5,cx,top+0.5);
          if(pw)ann('جدار الركيزة',0,0.8+H/2,cx,0.8+H/2);else ann('عمود',zc(0),0.8+H/2,cx,0.8+H/2);
          ann('قاعدة',pw?0:zc(0),0.4,cx,0.4);
        }
      }
    }
  }
  const nm={girder:'برافدات',arch:'مقوّس',cable:'بالكابلات'}[type];
  trMsg='جسر '+nm+' · '+n+' فتحات · الطول '+(tot+1.2).toFixed(1)+' م · العرض '+W+' م'+(cut==='long'?' — اختر منظر «أمامي» لرؤية المقطع':cut==='trans'?' — اختر منظر «جانبي» لرؤية المقطع':'');
}

let selSet=[],sst=null;
const rb=document.createElement('div');rb.style.display='none';document.body.appendChild(rb);
const sbv=new THREE.Vector3();
function scrBox(m){
  m.updateMatrixWorld();
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(let i=0;i<8;i++){
    sbv.set(i&1?0.5:-0.5,i&2?1:0,i&4?0.5:-0.5).applyMatrix4(m.matrixWorld).project(camera);
    const px=(sbv.x+1)/2*innerWidth,py=(1-sbv.y)/2*innerHeight;
    a=Math.min(a,px);b=Math.min(b,py);c=Math.max(c,px);d=Math.max(d,py);
  }
  return [a,b,c,d];
}
function setSel(arr){
  selSet.forEach(m=>{if(m.material)m.material.emissive.setHex(0);});
  select(null);
  selSet=arr.slice();
  if(selSet.length===1)select(selSet[0]);
  else if(selSet.length>1){
    selSet.forEach(m=>m.material.emissive.setHex(0x1a5a99));
    info.innerHTML='<span>المحدد: '+selSet.length+' عنصر</span>';
  }
  document.getElementById('sa').style.display=selSet.length?'flex':'none';
  document.getElementById('sa-del').textContent='حذف ('+selSet.length+')';
}
function rbDraw(){
  const s=sst,win=s.x1>=s.x0;
  rb.style.cssText='display:block;position:fixed;pointer-events:none;left:'+Math.min(s.x0,s.x1)+'px;top:'+Math.min(s.y0,s.y1)+'px;width:'+Math.abs(s.x1-s.x0)+'px;height:'+Math.abs(s.y1-s.y0)+'px;border:1.5px '+(win?'solid #2a7fff':'dashed #2ea043')+';background:'+(win?'rgba(42,127,255,.15)':'rgba(46,160,67,.15)');
}
function selDown(e){
  const m=pick(e);
  if(m){
    if(selSet.indexOf(m)<0)setSel([m]);
    const g=ground(e);
    if(!g)return;
    sst={mode:'move',hit:m,g0:g,orig:selSet.map(o=>[o,o.position.x,o.position.z]),done:false};
  }else{
    sst={mode:'box',x0:e.clientX,y0:e.clientY,x1:e.clientX,y1:e.clientY};
    rbDraw();
  }
}
function selMove(e){
  if(!sst)return;
  if(sst.mode==='move'){
    const g=ground(e);if(!g)return;
    const dx=g.x-sst.g0.x,dz=g.z-sst.g0.z;
    if(!sst.done&&(dx||dz)){undo.push({k:'mvset',o:sst.orig});sst.done=true;}
    if(sst.done)sst.orig.forEach(a=>{a[0].position.x=a[1]+dx;a[0].position.z=a[2]+dz;});
  }else{sst.x1=e.clientX;sst.y1=e.clientY;rbDraw();}
}
function selUp(e){
  const s=sst;sst=null;rb.style.display='none';
  if(!s)return;
  if(s.mode==='move'){if(!s.done)setSel([s.hit]);return;}
  if(Math.abs(s.x1-s.x0)<6&&Math.abs(s.y1-s.y0)<6){setSel([]);return;}
  const win=s.x1>=s.x0,x1=Math.min(s.x0,s.x1),x2=Math.max(s.x0,s.x1),y1=Math.min(s.y0,s.y1),y2=Math.max(s.y0,s.y1);
  setSel(boxes.filter(m=>{
    const b=scrBox(m);
    return win?(b[0]>=x1&&b[2]<=x2&&b[1]>=y1&&b[3]<=y2):(b[2]>=x1&&b[0]<=x2&&b[3]>=y1&&b[1]<=y2);
  }));
}
function cloneMesh(m){
  const c=new THREE.Mesh(m.geometry,m.material.clone());
  c.userData.cyl=m.userData.cyl;c.userData.kind=m.userData.kind;c.userData.N=m.userData.N;
  c.position.copy(m.position);c.rotation.copy(m.rotation);c.scale.copy(m.scale);
  m.children.forEach(ch=>{if(ch.isLineSegments)c.add(new THREE.LineSegments(ch.geometry,lineMat));});
  scene.add(c);boxes.push(c);return c;
}
document.getElementById('sa-del').onclick=()=>{
  if(!selSet.length)return;
  const ms=selSet.slice();setSel([]);
  ms.forEach(m=>{scene.remove(m);const i=boxes.indexOf(m);if(i>=0)boxes.splice(i,1);});
  undo.push({k:'mdel',ms});
};
document.getElementById('sa-copy').onclick=()=>{
  if(!selSet.length)return;
  const cs=selSet.map(m=>{const c=cloneMesh(m);c.position.x+=1;c.position.z+=1;return c;});
  undo.push({k:'multi',ms:cs});setSel(cs);
};

function readHP(){
  return {H:Math.min(8,Math.max(0,num(document.getElementById('h-h').value)||0)),t:Math.min(0.5,Math.max(0.08,num(document.getElementById('h-t').value)||0.2)),text:document.getElementById('h-txt').value};
}
function parseHouse(txt){
  const rooms=[],ops=[];
  txt.split('\n').forEach(line=>{
    const tk=line.trim().split(/\s+/);if(tk.length<4)return;
    const nm=tk.map(s=>num(s));
    if(tk[0]==='باب'||tk[0]==='نافذة'){
      if(nm[1]===nm[1]&&nm[2]===nm[2])ops.push({k:tk[0]==='باب'?'d':'w',x:nm[1],y:nm[2],w:nm[3]>0?nm[3]:1});
      return;
    }
    const n4=nm.slice(-4);
    if(tk.length<5||n4.some(v=>!(v===v))||n4[2]<=0||n4[3]<=0)return;
    rooms.push({name:tk.slice(0,tk.length-4).join(' '),x:n4[0],y:n4[1],w:n4[2],d:n4[3]});
  });
  return {rooms,ops};
}
function hInfo(){
  const p=readHP(),q=parseHouse(p.text);let a=1e9,b=-1e9,c=1e9,d=-1e9;
  q.rooms.forEach(r=>{a=Math.min(a,r.x);b=Math.max(b,r.x+r.w);c=Math.min(c,r.y);d=Math.max(d,r.y+r.d);});
  document.getElementById('h-info').textContent=q.rooms.length?('الأبعاد الخارجية '+(b-a+2*p.t).toFixed(2)+' × '+(d-c+2*p.t).toFixed(2)+' م · '+q.rooms.length+' غرفة · '+q.ops.length+' فتحة'):'لا توجد غرف';
}

function rebuildHouse(grp){
  grp.L.forEach(m=>{scene.remove(m);const i=boxes.indexOf(m);if(i>=0)boxes.splice(i,1);});
  grp.L.length=0;
  if(grp.L.lab){grp.L.lab.slice().forEach(rmLabel);grp.L.lab.length=0;}
  select(null);
  buildHouseP(grp.L,grp.x,grp.z,grp.y0,grp.p);
  grp.L.forEach(m=>m.userData.house=grp);
}

function buildHouseP(L,x,z,y0,p){
  const q=parseHouse(p.text),rooms=q.rooms,ops=q.ops,t=p.t,flat=!(p.H>0.05),hh=flat?0.1:p.H;
  if(!rooms.length)return;
  const WC=flat?0x2a3f8f:0xe8e2d0;
  const Hs={},Vs={},key=c=>Math.round(c*1000);
  const addS=(M,c,a,b)=>{const k=key(c);(M[k]=M[k]||{c,iv:[]}).iv.push([a,b]);};
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  rooms.forEach(r=>{
    const x1=r.x-t/2,x2=r.x+r.w+t/2,y1=r.y-t/2,y2=r.y+r.d+t/2;
    addS(Hs,y1,x1,x2);addS(Hs,y2,x1,x2);addS(Vs,x1,y1,y2);addS(Vs,x2,y1,y2);
    minx=Math.min(minx,x1);maxx=Math.max(maxx,x2);miny=Math.min(miny,y1);maxy=Math.max(maxy,y2);
  });
  const walls=[];
  const collect=(M,o)=>{
    for(const k in M){
      const w=M[k],iv=w.iv.sort((a,b)=>a[0]-b[0]),m=[];
      iv.forEach(s=>{const l=m[m.length-1];if(l&&s[0]<=l[1]+1e-6)l[1]=Math.max(l[1],s[1]);else m.push([s[0],s[1]]);});
      m.forEach(s=>walls.push({o,c:w.c,a:s[0],b:s[1],ops:[]}));
    }
  };
  collect(Hs,'h');collect(Vs,'v');
  ops.forEach(op=>{
    let best=null,bd=1e9;
    walls.forEach(w=>{
      const along=w.o==='h'?op.x:op.y,across=w.o==='h'?op.y:op.x,d=Math.abs(across-w.c);
      if(d<=t*0.8&&along>=w.a-1e-6&&along<=w.b+1e-6&&d<bd){bd=d;best=w;}
    });
    if(best)best.ops.push({p:best.o==='h'?op.x:op.y,w:op.w,k:op.k});
  });
  const box=(o,c,s1,s2,yb,yh)=>{
    if(s2-s1<0.01||yh<0.01)return;
    if(o==='h')part(L,x+(s1+s2)/2,y0+yb,z+c,s2-s1,yh,t,WC);
    else part(L,x+c,y0+yb,z+(s1+s2)/2,t,yh,s2-s1,WC);
  };
  walls.forEach(w=>{
    const s1=w.o==='h'?w.a-t/2:w.a+t/2,s2=w.o==='h'?w.b+t/2:w.b-t/2;
    let cur=s1;
    w.ops.sort((a,b)=>a.p-b.p).forEach(op=>{
      const a=Math.max(cur,op.p-op.w/2),b=Math.min(s2,op.p+op.w/2);
      if(b<=a)return;
      box(w.o,w.c,cur,a,0,hh);
      if(!flat){
        if(op.k==='w'){box(w.o,w.c,a,b,0,Math.min(0.9,hh));box(w.o,w.c,a,b,2.1,hh-2.1);}
        else box(w.o,w.c,a,b,2.1,hh-2.1);
      }
      cur=b;
    });
    box(w.o,w.c,cur,s2,0,hh);
  });
  part(L,x+(minx+maxx)/2,y0,z+(miny+maxy)/2,maxx-minx,0.04,maxy-miny,0xd9d2c0);
  rooms.forEach(r=>addLabel(L,r.name+' '+r.w.toFixed(2)+'×'+r.d.toFixed(2),x+r.x+r.w/2,y0+0.3,z+r.y+r.d/2));
  trMsg='منزل '+(maxx-minx+t).toFixed(2)+' × '+(maxy-miny+t).toFixed(2)+' م · '+rooms.length+' غرفة · '+(flat?'مخطط ثنائي — ارفع الجدران من أيقونة «منزل»':'ارتفاع الجدران '+p.H+' م');
}

function readSP(){
  const v=id=>num(document.getElementById(id).value);
  const type=document.getElementById('s-type').value,nf=type==='one'?1:type==='two'?2:3;
  const Hf=Math.max(1,v('s-h')||3.06),w=Math.max(0.6,v('s-w')||1.2),e=Math.max(0.08,v('s-e')||0.15);
  let n=Math.round(v('s-n')||0);
  if(n<2)n=Math.max(2,Math.round(Hf/(nf*0.17)));
  return {type,nf,Hf,w,e,n:Math.min(60,n)};
}

function buildStairsP(L,x,z,y0,p){
  const type=p.type;
  const Hf=p.Hf,w=p.w,e=p.e;
  const nf=type==='one'?1:type==='two'?2:3;
  const n=p.n,r=Hf/(nf*n),t=Math.max(0.1,0.64-2*r),fh=n*r,nt=n*t;
  const S=0xc9cdd2,B=0xb9bfc6,CP=0xa9afb6;
  const flight=(ox,oz,phi,yb,idx)=>{
    const c=Math.cos(phi),s=Math.sin(phi),th=Math.atan2(r,t),Ls=Math.hypot(nt,fh);
    for(let k=0;k<n;k++){
      const u=(k+0.5)*t;
      part(L,x+ox+u*c,y0+yb+k*r,z+oz+u*s,t,r,w,S);
      L[L.length-1].rotation.y=-phi;
    }
    const um=nt/2+e*Math.sin(th),ym=fh/2-e*Math.cos(th);
    part(L,x+ox+um*c,y0+yb+ym,z+oz+um*s,Ls,e,w,B);
    const m=L[L.length-1];m.rotation.y=-phi;m.rotation.z=th;
    addLabel(L,'قلبة '+idx,x+ox+nt/2*c,y0+yb+fh/2+0.9,z+oz+nt/2*s);
  };
  const land=(cx,cz,top,lw,ld)=>{
    part(L,x+cx,y0+top-e,z+cz,lw,e,ld,CP);
    addLabel(L,'بسطة',x+cx,y0+top+0.5,z+cz);
  };
  if(type==='one'){
    flight(0,0,0,0,1);land(nt+0.6,0,fh,1.2,w);
  }else if(type==='two'){
    const g=0.1;
    flight(0,0,0,0,1);
    land(nt+w/2,(w+g)/2,fh,w,2*w+g);
    flight(nt,w+g,Math.PI,fh,2);
    land(-0.6,w+g,2*fh,1.2,w);
  }else{
    flight(0,0,0,0,1);
    land(nt+w/2,0,fh,w,w);
    flight(nt+w/2,w/2,Math.PI/2,fh,2);
    land(nt+w/2,w/2+nt+w/2,2*fh,w,w);
    flight(nt,w/2+nt+w/2,Math.PI,2*fh,3);
    land(-0.6,w/2+nt+w/2,3*fh,1.2,w);
  }
  trMsg=nf+' قلبة · '+n+' درجة لكل قلبة · القائمة '+(r*100).toFixed(1)+' سم · النائمة '+(t*100).toFixed(1)+' سم · 2h+g = '+(2*r*100+t*100).toFixed(1)+' سم ✓ بلوندل';
}

function validNumber(v){return typeof v==='number'&&Number.isFinite(v);}
function restoreObject(a){
  if(!a||typeof a!=='object')return;
  const x=a.x??a[0],z=a.z??a[1],w=a.width??a[2],d=a.depth??a[3],h=a.height??a[4];
  const c=a.color??a[5],kind=a.kind??a[6]??0,ry=a.rotationY??a[7]??0,y=a.baseY??a[8]??0,rz=a.rotationZ??a[9]??0;
  if(![x,z,w,d,h,c,kind,ry,y,rz].every(validNumber)||w<=0||d<0||h<=0)return;
  const m=kind?addCyl(x,z,w,h,kind):addBox(x,z,w,d,h);
  m.material.color.setHex(c);m.rotation.y=ry;m.position.y=y;m.rotation.z=rz;
}

    const project=JSON.parse(raw);

    if(!Array.isArray(objects))throw new Error('Invalid project format');
    boxes.forEach(m=>scene.remove(m));boxes.length=0;undo.length=0;setSel([]);
    clearLabels();

      project.labels.forEach(l=>{
        if(l&&typeof l.text==='string'&&[l.x,l.y,l.z].every(validNumber))addLabel([],l.text,l.x,l.y,l.z);
      });
    }
    flash('تم فتح المشروع');
  }catch(e){
    flash('تعذر فتح المشروع؛ الملف المحفوظ تالف أو غير متوافق');
  }
};
const rc=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function ray(e){const r=el.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(ndc,camera);}
function ground(e,y){ray(e);plane.constant=-(y||0);const t=new THREE.Vector3();if(!rc.ray.intersectPlane(plane,t))return null;t.x=snap(t.x);t.z=snap(t.z);t.y=y||0;return t;}
function surf(e){
  ray(e);
  const h=rc.intersectObjects(boxes,false)[0];
  if(h){
    const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);
    if(n.y>0.7)return new THREE.Vector3(snap(h.point.x),Math.round(h.point.y*100)/100,snap(h.point.z));
  }
  return ground(e,0);
}
function pick(e){ray(e);const h=rc.intersectObjects(boxes,false);return h.length?h[0].object:null;}

function updatePreview(){
  const a=drawing.a,b=drawing.b,w=Math.abs(a.x-b.x),d=Math.abs(a.z-b.z);
  preview.visible=w>0&&d>0;
  preview.scale.set(Math.max(w,0.01),0.03,Math.max(d,0.01));
  preview.position.set((a.x+b.x)/2,drawing.y,(a.z+b.z)/2);
  showInfo(w,d,0);
}
function finishRect(){
  const a=drawing.a,b=drawing.b;drawing=null;preview.visible=false;
  const w=Math.abs(a.x-b.x),d=Math.abs(a.z-b.z);
  if(w<0.5||d<0.5){info.innerHTML='';return;}
  const m=addBox((a.x+b.x)/2,(a.z+b.z)/2,w,d,0.02);m.position.y=a.y;
  undo.push({k:'add',m});
  setTool('pull');select(m);
}

const ptrs=new Map();
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('pointerdown',e=>{
  el.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){cancelOps();return;}
  if(tool==='rect'){
    const p=surf(e);
    if(p){drawing={a:p,b:p,y:p.y};updatePreview();}else rot=true;
  }else if(tool==='pull'){
    const m=pick(e);
    if(m){
      select(m);
      const n=rc.intersectObjects(boxes,false)[0].face.normal;
      let ax='y';
      if(!m.userData.cyl&&Math.abs(n.y)<0.5)ax=Math.abs(n.x)>0.5?'x':'z';
      pull={m,ax,sg:ax==='x'?Math.sign(n.x):Math.sign(n.z),y0:e.clientY,g0:ground(e)||new THREE.Vector3(),h0:m.scale.y,w0:m.scale.x,d0:m.scale.z,x0:m.position.x,z0:m.position.z,done:false};
    }else{select(null);rot=true;}
  }else if(tool==='move'){
    const m=pick(e),g=ground(e);
    if(m&&g){select(m);mv={m,g0:g,x0:m.position.x,z0:m.position.z,done:false};}else rot=true;
  }else if(tool==='paint'){
    const m=pick(e);
    if(m){undo.push({k:'col',m,c:m.material.color.getHex()});m.material.color.setHex(color);select(m);}else rot=true;
  }else if(tool==='del'){
    const m=pick(e);
    if(m){scene.remove(m);boxes.splice(boxes.indexOf(m),1);undo.push({k:'del',m});if(sel===m)select(null);}else rot=true;
  }else if(tool==='col'){
    const g=surf(e);
    if(g){const m=addCyl(g.x,g.z,0.4,3);m.position.y=g.y;undo.push({k:'add',m});setTool('pull');select(m);}else rot=true;
  }else if(tool==='meas'){
    const g=surf(e);
    if(g){ms={a:g};measUpdate(g);}else rot=true;
  }else if(tool==='wall'){
    const g=surf(e);
    if(g){wl={a:g,b:g};wallPrev();}else rot=true;
  }else if(tool==='circ'){
    const g=surf(e);
    if(g){cr={c:g,b:g};circPrev();}else rot=true;
  }else if(tool==='lib'){
    const g=surf(e);
    if(g){place(libItem,g);setTool('orbit');}else rot=true;
  }else if(tool==='sel'){
    selDown(e);
  }else if(tool==='rot'){
    const m=pick(e);
    if(m){select(m);rt={m,x0:e.clientX,r0:m.rotation.y,done:false};}else rot=true;
  }else rot=true;
});
el.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(pinch){
      dist=clamp(dist*pinch.d/d,3,70);
      yaw-=(mx-pinch.mx)*0.008;
      pitch=clamp(pitch+(my-pinch.my)*0.008,0.05,1.5);
    }
    pinch={d,mx,my};return;
  }
  if(ptrs.size!==1)return;
  if(drawing){const g=ground(e,drawing.y);if(g){drawing.b=g;updatePreview();}}
  else if(pull){
    const p=pull,m=p.m;
    if(!p.done){undo.push({k:'sz',m,x:p.x0,z:p.z0,sx:p.w0,sy:p.h0,sz:p.d0});p.done=true;}
    if(p.ax==='y'){m.scale.y=Math.max(0.1,Math.round((p.h0+(p.y0-e.clientY)*dist/450)*10)/10);}
    else{
      const g=ground(e);
      if(g){
        const th=m.rotation.y,c=Math.cos(th),s=Math.sin(th),ddx=g.x-p.g0.x,ddz=g.z-p.g0.z;
        if(p.ax==='x'){const w=Math.max(0.1,p.w0+p.sg*(ddx*c-ddz*s));m.scale.x=w;const sh=p.sg*(w-p.w0)/2;m.position.x=p.x0+sh*c;m.position.z=p.z0-sh*s;}
        else{const d=Math.max(0.1,p.d0+p.sg*(ddx*s+ddz*c));m.scale.z=d;const sh=p.sg*(d-p.d0)/2;m.position.x=p.x0+sh*s;m.position.z=p.z0+sh*c;}
      }
    }
    showInfo(m.scale.x,m.scale.z,m.scale.y);
  }else if(sst){selMove(e);
  }else if(wl){
    const g=ground(e,wl.a.y);if(g){wl.b=g;wallPrev();}
  }else if(cr){
    const g=ground(e,cr.c.y);if(g){cr.b=g;circPrev();}
  }else if(rt){
    const q=Math.PI/12;
    if(!rt.done){undo.push({k:'rot',m:rt.m,r:rt.r0});rt.done=true;}
    rt.m.rotation.y=Math.round((rt.r0-(e.clientX-rt.x0)*0.01)/q)*q;
  }else if(ms){
    const g=ground(e,ms.a.y);if(g)measUpdate(g);
  }else if(mv){
    const g=ground(e);
    if(g){
      if(!mv.done){undo.push({k:'mv',m:mv.m,x:mv.x0,z:mv.z0});mv.done=true;}
      mv.m.position.x=mv.x0+g.x-mv.g0.x;mv.m.position.z=mv.z0+g.z-mv.g0.z;
    }
  }else if(rot){
    if(tool==='pan'){
      const k=dist*0.0015;
      tx+=-dx*k*Math.cos(yaw)-dy*k*Math.sin(yaw);
      tz+=dx*k*Math.sin(yaw)-dy*k*Math.cos(yaw);
    }else{yaw-=dx*0.01;pitch=clamp(pitch+dy*0.01,0.05,1.5);}
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(sst)selUp(e);
  if(drawing)finishRect();
  if(cr)finishCirc();
  pull=null;mv=null;ms=null;rt=null;rot=false;
}
el.addEventListener('pointerup',up);
el.addEventListener('pointercancel',up);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

setTool('orbit');
(function loop(){
  camera.position.set(
    tx+dist*Math.cos(pitch)*Math.sin(yaw),
    dist*Math.sin(pitch),
    tz+dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(tx,0.5,tz);
  updLabels();renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
